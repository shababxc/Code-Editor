<!DOCTYPE html>
<html lang="bn" uju: p>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" ch zuhufz, .ontent="width=device-width, initial-scale=1.0">
    <title>Code Editor App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0d1117; color: #e6edf3; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* ========== হোমপেজের হেডার ========== */
        header { background-color: #0d1117; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; flex: 0 0 auto; }
        header h1 { font-size: 24px; font-weight: bold; }
        header .top-icons { font-size: 18px; color: #8b949e; display: flex; gap: 15px; }
        header .top-icons i { cursor: pointer; }

        /* ✅ এডিটর স্ক্রিনে অ্যাপ হেডার লুকানো (শুধু হোমপেজে দেখা যাবে) */
        body.editor-mode header { display: none; }

        /* Screen Views */
        .screen { display: none; flex-direction: column; flex: 1 1 auto; min-height: 0; overflow-y: auto; }
        .screen.active { display: flex; }

        .home-container { padding: 15px; }
        .card { background-color: #161b22; border-radius: 12px; padding: 16px; margin-bottom: 20px; border: 1px solid #30363d; }
        .card-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; color: #58a6ff; }
        .card-subtitle { font-size: 13px; color: #8b949e; margin-bottom: 15px; }

        .lang-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .lang-btn { background-color: #21262d; border: 1px solid #30363d; border-radius: 8px; padding: 12px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .lang-badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .py-badge { background: #1e3a8a; color: #60a5fa; }
        .js-badge { background: #78350f; color: #facc15; }
        .c-badge { background: #4c1d95; color: #a78bfa; }
        .html-badge { background: #7c2d12; color: #f97316; }

        .more-lang { color: #58a6ff; font-size: 13px; margin-top: 10px; cursor: pointer; font-weight: 500; }

        .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .action-btn { background-color: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 14px; text-align: center; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; }

        .section-title { font-size: 15px; font-weight: 600; color: #8b949e; margin-bottom: 12px; }
        .file-item { background-color: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; cursor: pointer; position: relative; }
        .file-item.pinned { border-color: #e3b341; background-color: #1b1f16; }

        .file-info { display: flex; align-items: center; gap: 12px; }
        .file-details h4 { font-size: 14px; font-weight: 600; margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
        .file-details p { font-size: 11px; color: #8b949e; display: flex; gap: 8px; align-items: center; }
        .tag-html { background-color: #1f2937; color: #38bdf8; padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .pin-icon { color: #e3b341; font-size: 11px; }

        .file-menu-btn { color: #8b949e; cursor: pointer; padding: 4px 6px; border-radius: 5px; }
        .file-menu-btn:hover { color: #e6edf3; background-color: #21262d; }
        .file-menu { display: none; position: absolute; right: 10px; top: 42px; z-index: 50; background-color: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 4px; min-width: 150px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
        .file-menu.open { display: block; }
        .file-menu button { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: none; color: #e6edf3; font-size: 13px; padding: 9px 10px; border-radius: 6px; cursor: pointer; text-align: left; }
        .file-menu button:hover { background-color: #21262d; }
        .file-menu button.danger { color: #f85149; }
        .file-menu hr { border: none; border-top: 1px solid #30363d; margin: 4px 0; }

        /* ========== এডিটর স্ক্রিন ========== */
        .editor-topbar { background-color: #161b22; padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #30363d; flex: 0 0 auto; }
        .editor-title { display: flex; align-items: center; gap: 10px; }
        .editor-title i { cursor: pointer; color: #8b949e; }
        .file-meta { display: flex; flex-direction: column; }
        .file-meta h3 { font-size: 15px; font-weight: 600; }
        .file-meta span { font-size: 11px; color: #8b949e; }

        /* ✅ এডিটর এরিয়া এখন আরও বড় (উপরের হেডার ও নিচের নেভ লুকানোর কারণে) */
        .editor-area { flex: 1 1 auto; min-height: 0; display: flex; position: relative; background-color: #0d1117; }
        .editor-area textarea { width: 100%; height: 100%; background: transparent; color: #e6edf3; border: none; outline: none; padding: 15px; font-family: monospace; font-size: 14px; line-height: 1.5; resize: none; }
        .editor-area .CodeMirror { flex: 1 1 auto; height: 100%; min-height: 0; font-family: monospace; font-size: 14px; background: #0d1117; color: #e6edf3; }
        .editor-area .CodeMirror-scroll { min-height: 100%; }
        .preview-iframe { flex: 1 1 auto; width: 100%; height: 100%; border: none; background: #fff; display: none; }

        /* ========== ✅ সিম্বল বার — কমপ্যাক্ট, ১ ২ ৩-এর মতো সাজানো ========== */
        .symbol-bar {
            background-color: #161b22;
            display: flex; flex-wrap: wrap;
            justify-content: center;         /* মাঝখানে গোছানো, ছড়ানো নয় */
            align-items: center;
            gap: 6px;                        /* ফাঁকা কমানো */
            padding: 6px 10px;
            border-top: 1px solid #30363d;
            color: #8b949e;
            font-family: monospace;
            font-size: 14px;
            flex: 0 0 auto;
        }
        .symbol-bar span {
            cursor: pointer;
            min-width: 30px;                 /* ছোট বাক্স */
            height: 26px;
            display: inline-flex; align-items: center; justify-content: center;
            padding: 0 6px;
            border-radius: 5px;
            background-color: #21262d;
            border: 1px solid #30363d;
        }
        .symbol-bar span:active { background-color: #30363d; color: #58a6ff; }

        .bottom-action-bar { background-color: #161b22; display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; border-top: 1px solid #30363d; flex: 0 0 auto; }
        .action-icons-left, .action-icons-right { display: flex; gap: 20px; align-items: center; color: #8b949e; font-size: 18px; }
        .action-icons-left i, .action-icons-right i { cursor: pointer; }
        .action-icons-right i:hover, .action-icons-left i:hover { color: #58a6ff; }

        /* ========== নিচের নেভ বার — শুধু হোমপেজে ========== */
        .bottom-nav { background-color: #0d1117; border-top: 1px solid #30363d; display: flex; justify-content: space-around; padding: 10px 0; flex: 0 0 auto; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: #8b949e; cursor: pointer; }
        .nav-item.active { color: #58a6ff; }
        .nav-item i { font-size: 16px; }

        /* ✅ এডিটর স্ক্রিনে নিচের তিনটা বটন লুকানো */
        body.editor-mode .bottom-nav { display: none; }

        #fileInput { display: none; }
    </style>
</head>
<body>

    <header>
        <h1 id="appTitle">Code Editor</h1>
        <div class="top-icons">
            <i class="fa-solid fa-crown" style="color:#e3b341;"></i>
            <i class="fa-solid fa-ellipsis-vertical"></i>
        </div>
    </header>

    <!-- HOME SCREEN -->
    <div id="homeScreen" class="screen active">
        <div class="home-container">
            <div class="card">
                <div class="card-title">What are you building today?</div>
                <div class="card-subtitle">Pick a language to start a file</div>
                <div class="lang-grid">
                    <div class="lang-btn" onclick="createNewFile('html')"><span class="lang-badge html-badge">html</span><span>HTML</span></div>
                    <div class="lang-btn" onclick="createNewFile('js')"><span class="lang-badge js-badge">js</span><span>JavaScript</span></div>
                    <div class="lang-btn" onclick="createNewFile('py')"><span class="lang-badge py-badge">py</span><span>Python</span></div>
                    <div class="lang-btn" onclick="createNewFile('c')"><span class="lang-badge c-badge">c</span><span>C</span></div>
                </div>
                <div class="more-lang">61 more languages &gt;</div>
            </div>

            <div class="action-btns">
                <div class="action-btn" onclick="document.getElementById('fileInput').click()"><i class="fa-regular fa-folder-open"></i> Open file</div>
                <div class="action-btn" onclick="pasteFromClipboard()"><i class="fa-regular fa-paste"></i> Paste code</div>
            </div>

            <div class="section-title">Recent</div>
            <div id="recentFileList"></div>
        </div>
    </div>

    <!-- EDITOR SCREEN -->
    <div id="editorScreen" class="screen">
        <div class="editor-topbar">
            <div class="editor-title">
                <i class="fa-solid fa-arrow-left" onclick="goHome()"></i>
                <div class="file-meta">
                    <h3 id="activeFileName">*index.html</h3>
                    <span id="activeFileLang">HTML · UTF-8 · Ln 1, Col 1</span>
                </div>
            </div>
            <i class="fa-solid fa-ellipsis-vertical" style="color: #8b949e;"></i>
        </div>

        <div class="editor-area">
            <textarea id="codeEditor" placeholder="এখানে আপনার কোড পেস্ট বা এডিট করুন..."></textarea>
            <iframe id="previewIframe" class="preview-iframe"></iframe>
        </div>

        <!-- ✅ কমপ্যাক্ট সিম্বল বার -->
        <div class="symbol-bar">
            <span>&lt;</span><span>-</span><span>{</span><span>}</span><span>(</span><span>)</span><span>[</span><span>]</span><span>&gt;</span>
        </div>

        <div class="bottom-action-bar">
            <div class="action-icons-left">
                <i class="fa-regular fa-folder" onclick="document.getElementById('fileInput').click()" title="Open File"></i>
                <i class="fa-solid fa-rotate-left" onclick="editor.undo()" title="Undo"></i>
                <i class="fa-solid fa-rotate-right" onclick="editor.redo()" title="Redo"></i>
                <i class="fa-solid fa-magnifying-glass" title="Search"></i>
                <i class="fa-solid fa-angle-left"></i>
                <i class="fa-solid fa-angle-right"></i>
            </div>
            <div class="action-icons-right">
                <i class="fa-solid fa-circle-play" style="color: #4CAF50;" onclick="togglePreview()" title="Preview"></i>
                <i class="fa-solid fa-floppy-disk" onclick="saveCurrentFile()" title="Save"></i>
                <i class="fa-solid fa-xmark" onclick="goHome()" title="Close"></i>
            </div>
        </div>
    </div>

    <!-- ✅ নিচের তিন বটন বার — শুধু হোমপেজে দেখা যাবে -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="goHome()"><i class="fa-solid fa-code"></i><span>Code Editor</span></div>
        <div class="nav-item"><i class="fa-regular fa-file-lines"></i><span>Text Editor</span></div>
        <div class="nav-item"><i class="fa-solid fa-gear"></i><span>Settings</span></div>
    </div>

    <input type="file" id="fileInput" onchange="handleFileUpload(event)">

<script>
    var editor = CodeMirror.fromTextArea(document.getElementById("codeEditor"), {
        mode: "htmlmixed", theme: "dracula", lineNumbers: true,
        autoCloseTags: true, matchBrackets: true, lineWrapping: true
    });
    var cmWrapper = editor.getWrapperElement();

    let defaultFiles = [
        { name: 'index.html', code: '<h1>Hello, World!</h1>\n<p>Your TMA Code Editor is working!</p>', time: '0 minutes ago', path: 'Downloads', pinned: false },
        { name: 'preview.html', code: '<style>body{background:black; color:lime; text-align:center; padding-top:50px;}</style><h1>Preview Mode</h1>', time: '2 hours ago', path: 'Downloads', pinned: false }
    ];

    let currentActiveFileIndex = -1;
    let isPreviewMode = false;

    function loadFiles() {
        const stored = localStorage.getItem('my_editor_files');
        if (stored) {
            try {
                const arr = JSON.parse(stored);
                if (Array.isArray(arr)) {
                    arr.forEach(f => { if (typeof f.pinned === 'undefined') f.pinned = false; });
                    return arr;
                }
            } catch (e) {}
        }
        localStorage.setItem('my_editor_files', JSON.stringify(defaultFiles));
        return defaultFiles;
    }
    function saveFiles(files) { localStorage.setItem('my_editor_files', JSON.stringify(files)); }

    function sortedFiles(files) {
        return files.slice().sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
    }

    function renderRecentFiles() {
        const files = loadFiles();
        const listContainer = document.getElementById('recentFileList');
        listContainer.innerHTML = '';

        sortedFiles(files).forEach((file) => {
            const index = files.indexOf(file);
            const item = document.createElement('div');
            item.className = 'file-item' + (file.pinned ? ' pinned' : '');
            item.onclick = () => openFile(index);
            const pinMark = file.pinned ? '<i class="fa-solid fa-thumbtack pin-icon"></i>' : '';

            item.innerHTML = `
                <div class="file-info">
                    <span class="lang-badge html-badge">htm</span>
                    <div class="file-details">
                        <h4>${pinMark}<span class="file-name-text">${escapeHtml(file.name)}</span></h4>
                        <p><span class="tag-html">${fileExtLabel(file.name)}</span> ${escapeHtml(file.time)} · ${escapeHtml(file.path)}</p>
                    </div>
                </div>
                <i class="fa-solid fa-ellipsis-vertical file-menu-btn" title="More options"></i>
                <div class="file-menu">
                    <button data-act="pin"><i class="fa-solid fa-thumbtack"></i> ${file.pinned ? 'Unpin' : 'Pin'}</button>
                    <button data-act="rename"><i class="fa-solid fa-pen"></i> Rename</button>
                    <hr>
                    <button data-act="remove" class="danger"><i class="fa-solid fa-trash"></i> Remove</button>
                </div>
            `;

            const menuBtn = item.querySelector('.file-menu-btn');
            const menu = item.querySelector('.file-menu');
            menuBtn.onclick = (e) => {
                e.stopPropagation();
                const wasOpen = menu.classList.contains('open');
                closeAllMenus();
                if (!wasOpen) menu.classList.add('open');
            };
            menu.onclick = (e) => {
                e.stopPropagation();
                const btn = e.target.closest('button');
                if (!btn) return;
                const act = btn.dataset.act;
                closeAllMenus();
                if (act === 'pin') togglePin(index);
                else if (act === 'rename') renameFile(index);
                else if (act === 'remove') removeFile(index);
            };
            listContainer.appendChild(item);
        });
    }

    function closeAllMenus() {
        document.querySelectorAll('.file-menu.open').forEach(m => m.classList.remove('open'));
    }
    document.addEventListener('click', closeAllMenus);

    function togglePin(index) {
        const files = loadFiles();
        files[index].pinned = !files[index].pinned;
        saveFiles(files); renderRecentFiles();
    }

    function renameFile(index) {
        const files = loadFiles();
        const oldName = files[index].name;
        const newName = prompt('ফাইলের নতুন নাম দিন (যেমন index.html):', oldName);
        if (newName === null) return;
        const clean = newName.trim();
        if (!clean) return;
        files[index].name = clean;
        saveFiles(files); renderRecentFiles();
        if (currentActiveFileIndex === index) {
            document.getElementById('activeFileName').innerText = '*' + clean;
        }
    }

    function removeFile(index) {
        const files = loadFiles();
        const name = files[index].name;
        if (!confirm('"' + name + '" ফাইলটি মুছে ফেলতে চান?')) return;
        files.splice(index, 1);
        saveFiles(files);
        if (currentActiveFileIndex === index) { currentActiveFileIndex = -1; goHome(); }
        renderRecentFiles();
    }

    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function fileExtLabel(name) {
        const ext = (name.split('.').pop() || '').toLowerCase();
        const map = { html: 'HTML', htm: 'HTML', js: 'JS', css: 'CSS', py: 'PY', c: 'C', cpp: 'CPP', json: 'JSON', md: 'MD' };
        return map[ext] || ext.toUpperCase() || 'FILE';
    }

    function openFile(index) {
        const files = loadFiles();
        currentActiveFileIndex = index;
        const file = files[index];

        document.getElementById('activeFileName').innerText = '*' + file.name;
        document.getElementById('activeFileLang').innerText = fileExtLabel(file.name) + ' · UTF-8 · Ln 1, Col 1';
        editor.setValue(file.code || '');
        editor.setCursor({ line: 0, ch: 0 });

        document.getElementById('homeScreen').classList.remove('active');
        document.getElementById('editorScreen').classList.add('active');

        // ✅ এডিটর মোড: অ্যাপ হেডার + নিচের নেভ বার লুকানো → এডিটর বড় হবে
        document.body.classList.add('editor-mode');

        closePreview();
        requestAnimationFrame(() => editor.refresh());
    }

    function createNewFile(ext) {
        let files = loadFiles();
        const fileName = `new_file_${files.length + 1}.${ext}`;
        files.unshift({ name: fileName, code: '', time: 'Just now', path: 'Local', pinned: false });
        saveFiles(files); renderRecentFiles(); openFile(0);
    }

    function saveCurrentFile() {
        if (currentActiveFileIndex === -1) return;
        let files = loadFiles();
        files[currentActiveFileIndex].code = editor.getValue();
        files[currentActiveFileIndex].time = 'Just now';
        saveFiles(files);
        alert('File saved successfully!');
        renderRecentFiles();
    }

    function togglePreview() {
        const iframe = document.getElementById('previewIframe');
        if (!isPreviewMode) {
            const code = editor.getValue();
            iframe.style.display = 'block';
            cmWrapper.style.display = 'none';
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            doc.open(); doc.write(code); doc.close();
            isPreviewMode = true;
        } else { closePreview(); }
    }

    function closePreview() {
        document.getElementById('previewIframe').style.display = 'none';
        cmWrapper.style.display = '';
        isPreviewMode = false;
    }

    async function pasteFromClipboard() {
        try {
            const text = await navigator.clipboard.readText();
            createNewFile('html');
            editor.setValue(text);
            saveCurrentFile();
        } catch (err) {
            alert('পেইস্ট করার জন্য অনুমতি প্রয়োজন অথবা ফাইল সিলেক্ট করুন।');
        }
    }

    function handleFileUpload(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            let files = loadFiles();
            files.unshift({ name: file.name, code: e.target.result, time: 'Just now', path: 'Uploaded', pinned: false });
            saveFiles(files); renderRecentFiles(); openFile(0);
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    function goHome() {
        closePreview();
        document.getElementById('editorScreen').classList.remove('active');
        document.getElementById('homeScreen').classList.add('active');
        // ✅ হোমপেজে ফিরলে হেডার ও নেভ বার আবার দেখাবে
        document.body.classList.remove('editor-mode');
        renderRecentFiles();
    }

    window.onload = function() {
        renderRecentFiles();
        editor.refresh();
    };
</script>
</body>
</html>
