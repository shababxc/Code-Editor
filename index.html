<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d1117">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Code Editor">
    
    <title>Code Editor App</title>
    
    <!-- CodeMirror CSS & Themes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
    
    <!-- CodeMirror Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
    <!-- ✅ JSX & Babel হাইলাইটিং এর জন্য স্ক্রিপ্ট -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/jsx/jsx.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
    
    <!-- ✅ দ্রুত সার্চ ও লাইন জাম্প করার জন্য সার্চ কার্সর লাইব্রেরি -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/searchcursor.min.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background-color: #0d1117; 
            color: #e6edf3; 
            display: flex; 
            flex-direction: column; 
            height: 100dvh; 
            overflow: hidden; 
            user-select: none;
        }

        /* ========== হোমপেজের হেডার ========== */
        header { 
            background-color: #0d1117; 
            padding: 15px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex: 0 0 auto;
            border-bottom: 1px solid #21262d;
        }
        header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
        header .top-icons { font-size: 18px; color: #8b949e; display: flex; gap: 15px; }
        header .top-icons i { cursor: pointer; }

        body.editor-mode header { display: none; }

        .screen { display: none; flex-direction: column; flex: 1 1 auto; min-height: 0; overflow-y: auto; }
        .screen.active { display: flex; }

        .home-container { padding: 15px; padding-bottom: 30px; }
        .card { background-color: #161b22; border-radius: 12px; padding: 16px; margin-bottom: 20px; border: 1px solid #30363d; }
        .card-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; color: #58a6ff; }
        .card-subtitle { font-size: 13px; color: #8b949e; margin-bottom: 15px; }

        .lang-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .lang-btn { background-color: #21262d; border: 1px solid #30363d; border-radius: 8px; padding: 12px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .lang-btn:active { transform: scale(0.98); background-color: #30363d; }
        .lang-badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .py-badge { background: #1e3a8a; color: #60a5fa; }
        .js-badge { background: #78350f; color: #facc15; }
        .c-badge { background: #4c1d95; color: #a78bfa; }
        .html-badge { background: #7c2d12; color: #f97316; }

        .more-lang { color: #58a6ff; font-size: 13px; margin-top: 10px; cursor: pointer; font-weight: 500; }

        .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .action-btn { background-color: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 14px; text-align: center; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; }

        .section-title { font-size: 15px; font-weight: 600; color: #8b949e; margin-bottom: 12px; }
        
        .file-item { 
            background-color: #161b22; 
            border: 1px solid #30363d; 
            border-radius: 10px; 
            padding: 12px 15px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            margin-bottom: 10px; 
            cursor: pointer; 
            position: relative; 
        }
        .file-item.pinned { border-color: #e3b341; background-color: #1b1f16; }

        .file-info { display: flex; align-items: center; gap: 12px; flex: 1; overflow: hidden; }
        .file-details { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .file-details h4 { font-size: 14px; font-weight: 600; margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
        .file-details p { font-size: 11px; color: #8b949e; display: flex; gap: 8px; align-items: center; }
        .tag-html { background-color: #1f2937; color: #38bdf8; padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .pin-icon { color: #e3b341; font-size: 11px; }

        .file-menu-btn { color: #8b949e; cursor: pointer; padding: 8px 10px; border-radius: 5px; }
        
        /* ড্রপডাউন মেনু (নিচের আইটেমের জন্য উপরে ওপেন হবে) */
        .file-menu { 
            display: none; 
            position: absolute; 
            right: 10px; 
            top: 42px; 
            z-index: 100; 
            background-color: #1c2128; 
            border: 1px solid #444c56; 
            border-radius: 8px; 
            padding: 5px; 
            min-width: 155px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.6); 
        }
        .file-menu.drop-up { top: auto; bottom: 42px; }
        .file-menu.open { display: block; }
        .file-menu button { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: none; color: #e6edf3; font-size: 13px; padding: 10px 12px; border-radius: 6px; cursor: pointer; text-align: left; }
        .file-menu button:hover { background-color: #2d333b; }
        .file-menu button.danger { color: #f85149; }
        .file-menu hr { border: none; border-top: 1px solid #373e47; margin: 4px 0; }

        /* ========== এডিটর স্ক্রিন ========== */
        .editor-topbar { background-color: #161b22; padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #30363d; flex: 0 0 auto; }
        .editor-title { display: flex; align-items: center; gap: 12px; }
        .editor-title i { cursor: pointer; color: #8b949e; font-size: 18px; padding: 4px; }
        .file-meta { display: flex; flex-direction: column; }
        .file-meta h3 { font-size: 15px; font-weight: 600; }
        .file-meta span { font-size: 11px; color: #8b949e; }

        /* ✅ সার্চ প্যানেল স্টাইল */
        .search-bar-panel {
            display: none;
            align-items: center;
            justify-content: space-between;
            background-color: #161b22;
            padding: 8px 12px;
            border-bottom: 1px solid #30363d;
            gap: 8px;
            flex: 0 0 auto;
            z-index: 20;
        }
        .search-bar-panel.active { display: flex; }
        .search-input-wrap {
            display: flex;
            align-items: center;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 6px 10px;
            flex: 1;
            gap: 8px;
        }
        .search-input-wrap:focus-within { border-color: #58a6ff; }
        .search-input-wrap input {
            background: transparent;
            border: none;
            outline: none;
            color: #e6edf3;
            font-size: 13px;
            width: 100%;
        }
        .search-count {
            font-size: 11px;
            color: #8b949e;
            white-space: nowrap;
        }
        .search-nav-btns { display: flex; align-items: center; gap: 6px; }
        .search-nav-btns button {
            background-color: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            border-radius: 6px;
            width: 32px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .search-nav-btns button:active { background-color: #30363d; color: #58a6ff; }

        /* ✅ এডিটর এরিয়া (লাইন নম্বর নিখুঁত বাজানো থাকবে) */
        .editor-area { flex: 1 1 auto; min-height: 0; display: flex; position: relative; background-color: #0d1117; user-select: text; }
        .editor-area .CodeMirror { 
            flex: 1 1 auto; 
            height: 100%; 
            min-height: 0; 
            font-family: 'Consolas', 'Courier New', monospace; 
            font-size: 13.5px; 
            line-height: 1.5;
            background: #0d1117; 
            color: #e6edf3; 
        }
        .editor-area .CodeMirror-scroll { 
            min-height: 100%; 
            overflow-x: auto !important; 
        }
        .editor-area .CodeMirror-gutters {
            background-color: #0d1117;
            border-right: 1px solid #21262d;
        }
        .editor-area .CodeMirror-linenumber {
            color: #484f58;
            padding: 0 8px 0 5px;
        }
        .preview-iframe { flex: 1 1 auto; width: 100%; height: 100%; border: none; background: #fff; display: none; }

        /* ========== সিম্বল বার ========== */
        .symbol-bar {
            background-color: #161b22;
            display: flex; 
            flex-wrap: nowrap;
            overflow-x: auto;
            align-items: center;
            gap: 6px;
            padding: 8px 10px;
            border-top: 1px solid #30363d;
            color: #8b949e;
            font-family: monospace;
            font-size: 14px;
            flex: 0 0 auto;
            scrollbar-width: none;
        }
        .symbol-bar::-webkit-scrollbar { display: none; }
        .symbol-bar span {
            cursor: pointer;
            min-width: 32px;
            height: 28px;
            display: inline-flex; align-items: center; justify-content: center;
            padding: 0 8px;
            border-radius: 6px;
            background-color: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            flex-shrink: 0;
        }
        .symbol-bar span:active { background-color: #388bfd; color: #ffffff; }

        .bottom-action-bar { background-color: #161b22; display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; border-top: 1px solid #30363d; flex: 0 0 auto; }
        .action-icons-left, .action-icons-right { display: flex; gap: 20px; align-items: center; color: #8b949e; font-size: 18px; }
        .action-icons-left i, .action-icons-right i { cursor: pointer; padding: 4px; }
        .action-icons-right i:hover, .action-icons-left i:hover { color: #58a6ff; }

        .bottom-nav { background-color: #0d1117; border-top: 1px solid #30363d; display: flex; justify-content: space-around; padding: 10px 0 14px 0; flex: 0 0 auto; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: #8b949e; cursor: pointer; }
        .nav-item.active { color: #58a6ff; }
        .nav-item i { font-size: 16px; }

        body.editor-mode .bottom-nav { display: none; }

        /* সেভ ফাইল মডাল */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(3px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            width: 100%;
            max-width: 340px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: #e6edf3; display: flex; align-items: center; gap: 8px; }
        .modal-input {
            width: 100%;
            padding: 10px 12px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #58a6ff;
            font-size: 14px;
            font-family: monospace;
            outline: none;
            margin-bottom: 15px;
        }
        .modal-input:focus { border-color: #58a6ff; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
        .btn { padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; }
        .btn-cancel { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
        .btn-save { background: #238636; color: #ffffff; }

        #fileInput { display: none; }
    </style>
</head>
<body>

    <header>
        <h1 id="appTitle">Code Editor</h1>
        <div class="top-icons">
            <i class="fa-solid fa-crown" style="color:#e3b341;"></i>
            <i class="fa-solid fa-ellipsis-vertical"></i>
        </div>
    </header>

    <!-- HOME SCREEN -->
    <div id="homeScreen" class="screen active">
        <div class="home-container">
            <div class="card">
                <div class="card-title">What are you building today?</div>
                <div class="card-subtitle">Pick a language to start a file</div>
                <div class="lang-grid">
                    <div class="lang-btn" onclick="createNewFile('html')"><span class="lang-badge html-badge">html</span><span>HTML</span></div>
                    <div class="lang-btn" onclick="createNewFile('js')"><span class="lang-badge js-badge">js</span><span>JavaScript</span></div>
                    <div class="lang-btn" onclick="createNewFile('py')"><span class="lang-badge py-badge">py</span><span>Python</span></div>
                    <div class="lang-btn" onclick="createNewFile('c')"><span class="lang-badge c-badge">c</span><span>C</span></div>
                </div>
                <div class="more-lang">61 more languages &gt;</div>
            </div>

            <div class="action-btns">
                <div class="action-btn" onclick="document.getElementById('fileInput').click()"><i class="fa-regular fa-folder-open"></i> Open file</div>
                <div class="action-btn" onclick="pasteFromClipboard()"><i class="fa-regular fa-paste"></i> Paste code</div>
            </div>

            <div class="section-title">Recent Files</div>
            <div id="recentFileList"></div>
        </div>
    </div>

    <!-- EDITOR SCREEN -->
    <div id="editorScreen" class="screen">
        <div class="editor-topbar">
            <div class="editor-title">
                <i class="fa-solid fa-arrow-left" onclick="goHome()"></i>
                <div class="file-meta">
                    <h3 id="activeFileName">*index.html</h3>
                    <span id="activeFileLang">HTML · UTF-8 · Ln 1, Col 1</span>
                </div>
            </div>
            <i class="fa-solid fa-ellipsis-vertical" style="color: #8b949e;" onclick="openSaveModal()"></i>
        </div>

        <!-- ✅ দ্রুত ও নিখুঁত সার্চ বার প্যানেল -->
        <div id="searchBarPanel" class="search-bar-panel">
            <div class="search-input-wrap">
                <i class="fa-solid fa-magnifying-glass" style="font-size: 13px; color: #8b949e;"></i>
                <input type="text" id="searchInput" placeholder="শব্দ, ট্যাগ বা লাইন সার্চ করুন..." oninput="doSearch()" onkeydown="handleSearchKey(event)">
                <span id="searchCount" class="search-count">0/0</span>
            </div>
            <div class="search-nav-btns">
                <button type="button" onclick="findPrevMatch()" title="Previous"><i class="fa-solid fa-chevron-up"></i></button>
                <button type="button" onclick="findNextMatch()" title="Next"><i class="fa-solid fa-chevron-down"></i></button>
                <button type="button" onclick="closeSearchBar()" title="Close"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>

        <div class="editor-area">
            <textarea id="codeEditor"></textarea>
            <iframe id="previewIframe" class="preview-iframe"></iframe>
        </div>

        <!-- সিম্বল বার -->
        <div class="symbol-bar">
            <span onclick="insertSymbol('<')">&lt;</span>
            <span onclick="insertSymbol('>')">&gt;</span>
            <span onclick="insertSymbol('/')">/</span>
            <span onclick="insertSymbol('=')">=</span>
            <span onclick="insertSymbol('\"')">"</span>
            <span onclick="insertSymbol('{')">{</span>
            <span onclick="insertSymbol('}')">}</span>
            <span onclick="insertSymbol('(')">(</span>
            <span onclick="insertSymbol(')')">)</span>
            <span onclick="insertSymbol('[')">[</span>
            <span onclick="insertSymbol(']')">]</span>
            <span onclick="insertSymbol(';')">;</span>
            <span onclick="insertSymbol(':')">:</span>
        </div>

        <div class="bottom-action-bar">
            <div class="action-icons-left">
                <i class="fa-regular fa-folder" onclick="document.getElementById('fileInput').click()" title="Open File"></i>
                <i class="fa-solid fa-rotate-left" onclick="editor.undo()" title="Undo"></i>
                <i class="fa-solid fa-rotate-right" onclick="editor.redo()" title="Redo"></i>
                <!-- ✅ সার্চ আইকন ক্লিক করলে সার্চ বার খুলবে -->
                <i class="fa-solid fa-magnifying-glass" onclick="toggleSearchBar()" title="Search & Update Line"></i>
            </div>
            <div class="action-icons-right">
                <i class="fa-solid fa-circle-play" style="color: #4CAF50;" onclick="togglePreview()" title="Preview"></i>
                <i class="fa-solid fa-floppy-disk" onclick="openSaveModal()" title="Save With Name"></i>
                <i class="fa-solid fa-xmark" onclick="goHome()" title="Close"></i>
            </div>
        </div>
    </div>

    <!-- হোমপেজের নিচের নেভ বার -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="goHome()"><i class="fa-solid fa-code"></i><span>Code Editor</span></div>
        <div class="nav-item"><i class="fa-regular fa-file-lines"></i><span>Text Editor</span></div>
        <div class="nav-item"><i class="fa-solid fa-gear"></i><span>Settings</span></div>
    </div>

    <!-- সেভ ফাইল পপআপ -->
    <div id="saveModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-title"><i class="fa-solid fa-floppy-disk" style="color:#58a6ff;"></i> Save File</div>
            <input type="text" id="saveFileNameInput" class="modal-input" placeholder="e.g. index.html" />
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="closeSaveModal()">Cancel</button>
                <button class="btn btn-save" onclick="confirmSaveFile()">Save</button>
            </div>
        </div>
    </div>

    <input type="file" id="fileInput" onchange="handleFileUpload(event)">

<script>
    // ✅ Babel ও JSX স্ক্রিপ্ট সাপোর্ট রেজিস্ট্রেশন (যাতে <script type="text/babel"> রঙিন হয়)
    if (window.CodeMirror) {
        CodeMirror.defineMIME("text/babel", { name: "javascript", jsx: true });
        CodeMirror.defineMIME("text/jsx", { name: "javascript", jsx: true });
    }

    const htmlCustomConfig = {
        name: "htmlmixed",
        tags: {
            script: [
                ["type", /^text\/(babel|jsx)$/i, "jsx"],
                ["type", /^module$/i, "javascript"],
                ["type", /.+/i, "javascript"] // যে কোনো স্ক্রিপ্ট টাইপকেই রঙিন দেখাবে
            ]
        }
    };

    var editor = CodeMirror.fromTextArea(document.getElementById("codeEditor"), {
        mode: htmlCustomConfig, 
        theme: "dracula", 
        lineNumbers: true,
        autoCloseTags: true, 
        matchBrackets: true, 
        /* ✅ lineWrapping: false করায় নম্বরের মাঝে কোনো গ্যাপ থাকবে না, নম্বরগুলো একটার সাথে একটা বাজানো থাকবে */
        lineWrapping: false,
        /* ✅ ৩২০০+ লাইনেও যাতে কালার নষ্ট না হয় */
        maxHighlightLength: Infinity,
        viewportMargin: 40
    });
    var cmWrapper = editor.getWrapperElement();

    let defaultFiles = [
        { name: 'index.html', code: '<!DOCTYPE html>\n<html>\n<head>\n  <title>Preview</title>\n</head>\n<body>\n  <div id="root"></div>\n  <script type="text/babel">\n    const { useState } = React;\n    const App = () => <h1>Hello React & Babel!</h1>;\n  <\/script>\n</body>\n</html>', time: 'Just now', path: 'Local', pinned: false }
    ];

    let currentActiveFileIndex = -1;
    let isPreviewMode = false;

    function loadFiles() {
        const stored = localStorage.getItem('my_editor_files');
        if (stored) {
            try {
                const arr = JSON.parse(stored);
                if (Array.isArray(arr)) {
                    arr.forEach(f => { if (typeof f.pinned === 'undefined') f.pinned = false; });
                    return arr;
                }
            } catch (e) {}
        }
        localStorage.setItem('my_editor_files', JSON.stringify(defaultFiles));
        return defaultFiles;
    }
    
    function saveFiles(files) { 
        localStorage.setItem('my_editor_files', JSON.stringify(files)); 
    }

    function sortedFiles(files) {
        return files.slice().sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
    }

    function renderRecentFiles() {
        const files = loadFiles();
        const listContainer = document.getElementById('recentFileList');
        listContainer.innerHTML = '';

        sortedFiles(files).forEach((file) => {
            const index = files.indexOf(file);
            const item = document.createElement('div');
            item.className = 'file-item' + (file.pinned ? ' pinned' : '');
            item.onclick = () => openFile(index);
            const pinMark = file.pinned ? '<i class="fa-solid fa-thumbtack pin-icon"></i>' : '';

            item.innerHTML = `
                <div class="file-info">
                    <span class="lang-badge ${badgeClass(file.name)}">${badgeText(file.name)}</span>
                    <div class="file-details">
                        <h4>${pinMark}<span class="file-name-text">${escapeHtml(file.name)}</span></h4>
                        <p><span class="tag-html">${fileExtLabel(file.name)}</span> ${escapeHtml(file.time)} · ${escapeHtml(file.path)}</p>
                    </div>
                </div>
                <i class="fa-solid fa-ellipsis-vertical file-menu-btn" title="More options"></i>
                <div class="file-menu">
                    <button data-act="pin"><i class="fa-solid fa-thumbtack"></i> ${file.pinned ? 'Unpin' : 'Pin'}</button>
                    <button data-act="rename"><i class="fa-solid fa-pen"></i> Rename</button>
                    <hr>
                    <button data-act="remove" class="danger"><i class="fa-solid fa-trash"></i> Remove</button>
                </div>
            `;

            const menuBtn = item.querySelector('.file-menu-btn');
            const menu = item.querySelector('.file-menu');

            menuBtn.onclick = (e) => {
                e.stopPropagation();
                const wasOpen = menu.classList.contains('open');
                closeAllMenus();
                
                if (!wasOpen) {
                    const rect = menuBtn.getBoundingClientRect();
                    const spaceBelow = window.innerHeight - rect.bottom;
                    if (spaceBelow < 160) { 
                        menu.classList.add('drop-up'); 
                    } else {
                        menu.classList.remove('drop-up');
                    }
                    menu.classList.add('open');
                }
            };

            menu.onclick = (e) => {
                e.stopPropagation();
                const btn = e.target.closest('button');
                if (!btn) return;
                const act = btn.dataset.act;
                closeAllMenus();
                if (act === 'pin') togglePin(index);
                else if (act === 'rename') renameFile(index);
                else if (act === 'remove') removeFile(index);
            };

            listContainer.appendChild(item);
        });
    }

    function closeAllMenus() {
        document.querySelectorAll('.file-menu.open').forEach(m => m.classList.remove('open'));
    }
    document.addEventListener('click', closeAllMenus);

    function togglePin(index) {
        const files = loadFiles();
        files[index].pinned = !files[index].pinned;
        saveFiles(files); 
        renderRecentFiles();
    }

    function renameFile(index) {
        const files = loadFiles();
        const oldName = files[index].name;
        const newName = prompt('ফাইলের নতুন নাম দিন (যেমন script.js):', oldName);
        if (newName === null) return;
        const clean = newName.trim();
        if (!clean) return;
        files[index].name = clean;
        saveFiles(files); 
        renderRecentFiles();
        if (currentActiveFileIndex === index) {
            document.getElementById('activeFileName').innerText = '*' + clean;
            setEditorMode(clean);
        }
    }

    function removeFile(index) {
        const files = loadFiles();
        const name = files[index].name;
        if (!confirm('"' + name + '" ফাইলটি মুছে ফেলতে চান?')) return;
        files.splice(index, 1);
        saveFiles(files);
        if (currentActiveFileIndex === index) { 
            currentActiveFileIndex = -1; 
            goHome(); 
        }
        renderRecentFiles();
    }

    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    
    function fileExtLabel(name) {
        const ext = (name.split('.').pop() || '').toLowerCase();
        const map = { html: 'HTML', htm: 'HTML', js: 'JS', css: 'CSS', py: 'PY', c: 'C', cpp: 'CPP', json: 'JSON', md: 'MD' };
        return map[ext] || ext.toUpperCase() || 'FILE';
    }

    function badgeText(name) {
        const ext = (name.split('.').pop() || '').toLowerCase();
        return ext.slice(0, 3) || 'txt';
    }

    function badgeClass(name) {
        const ext = (name.split('.').pop() || '').toLowerCase();
        if (ext === 'html' || ext === 'htm') return 'html-badge';
        if (ext === 'js') return 'js-badge';
        if (ext === 'py') return 'py-badge';
        if (ext === 'c' || ext === 'cpp') return 'c-badge';
        return 'html-badge';
    }

    function setEditorMode(fileName) {
        const ext = (fileName.split('.').pop() || '').toLowerCase();
        if (ext === 'js') editor.setOption('mode', 'javascript');
        else if (ext === 'css') editor.setOption('mode', 'css');
        else if (ext === 'py') editor.setOption('mode', 'python');
        else if (ext === 'c' || ext === 'cpp') editor.setOption('mode', 'text/x-csrc');
        else editor.setOption('mode', htmlCustomConfig);
    }

    function openFile(index) {
        const files = loadFiles();
        currentActiveFileIndex = index;
        const file = files[index];

        document.getElementById('activeFileName').innerText = '*' + file.name;
        document.getElementById('activeFileLang').innerText = fileExtLabel(file.name) + ' · UTF-8';
        setEditorMode(file.name);

        editor.setValue(file.code || '');
        editor.setCursor({ line: 0, ch: 0 });

        document.getElementById('homeScreen').classList.remove('active');
        document.getElementById('editorScreen').classList.add('active');

        document.body.classList.add('editor-mode');
        closePreview();
        setTimeout(() => editor.refresh(), 100);
    }

    function createNewFile(ext) {
        let files = loadFiles();
        const fileName = `file_${files.length + 1}.${ext}`;
        files.unshift({ name: fileName, code: '', time: 'Just now', path: 'Local', pinned: false });
        saveFiles(files); 
        renderRecentFiles(); 
        openFile(0);
    }

    /* ========== সেভ ফাইল মডাল লজিক ========== */
    function openSaveModal() {
        if (currentActiveFileIndex === -1) return;
        const files = loadFiles();
        const curName = files[currentActiveFileIndex].name;
        const input = document.getElementById('saveFileNameInput');
        input.value = curName;
        document.getElementById('saveModal').classList.add('active');
        input.focus();
        input.select();
    }

    function closeSaveModal() {
        document.getElementById('saveModal').classList.remove('active');
    }

    function confirmSaveFile() {
        const input = document.getElementById('saveFileNameInput');
        let newName = input.value.trim();
        if (!newName) {
            alert('দয়া করে ফাইলের একটি নাম দিন!');
            return;
        }

        let files = loadFiles();
        files[currentActiveFileIndex].name = newName;
        files[currentActiveFileIndex].code = editor.getValue();
        files[currentActiveFileIndex].time = 'Just now';
        saveFiles(files);

        document.getElementById('activeFileName').innerText = '*' + newName;
        document.getElementById('activeFileLang').innerText = fileExtLabel(newName) + ' · UTF-8';
        setEditorMode(newName);

        closeSaveModal();
        renderRecentFiles();
    }

    /* ========== ✅ সার্চ এবং ব্লক জাম্প করার কার্যকরী লজিক ========== */
    let currentMatches = [];
    let currentMatchIndex = -1;

    function toggleSearchBar() {
        const panel = document.getElementById("searchBarPanel");
        panel.classList.toggle("active");
        if (panel.classList.contains("active")) {
            const input = document.getElementById("searchInput");
            input.focus();
            if (input.value) doSearch();
        } else {
            editor.focus();
        }
    }

    function closeSearchBar() {
        document.getElementById("searchBarPanel").classList.remove("active");
        editor.focus();
    }

    function doSearch() {
        const query = document.getElementById("searchInput").value;
        const countEl = document.getElementById("searchCount");
        currentMatches = [];
        currentMatchIndex = -1;

        if (!query) {
            countEl.innerText = "0/0";
            return;
        }

        // পুরো কোডের যেখানে যেখানে মিল রয়েছে তা বের করা
        const cursor = editor.getSearchCursor(query, {line: 0, ch: 0}, {caseFold: true});
        while (cursor.findNext()) {
            currentMatches.push({from: cursor.from(), to: cursor.to()});
        }

        if (currentMatches.length > 0) {
            currentMatchIndex = 0;
            selectCurrentMatch();
        } else {
            countEl.innerText = "0/0";
        }
    }

    function selectCurrentMatch() {
        if (currentMatches.length === 0 || currentMatchIndex < 0) return;
        const match = currentMatches[currentMatchIndex];
        document.getElementById("searchCount").innerText = `${currentMatchIndex + 1}/${currentMatches.length}`;
        
        // এডিটর নির্দিষ্ট লাইনে জাম্প করবে এবং টেক্সট সিলেক্ট করবে যাতে সরাসরি এডিট করা যায়
        editor.setSelection(match.from, match.to);
        editor.scrollIntoView({from: match.from, to: match.to}, 120);
    }

    function findNextMatch() {
        if (currentMatches.length === 0) return;
        currentMatchIndex = (currentMatchIndex + 1) % currentMatches.length;
        selectCurrentMatch();
    }

    function findPrevMatch() {
        if (currentMatches.length === 0) return;
        currentMatchIndex = (currentMatchIndex - 1 + currentMatches.length) % currentMatches.length;
        selectCurrentMatch();
    }

    function handleSearchKey(e) {
        if (e.key === "Enter") {
            e.preventDefault();
            if (e.shiftKey) findPrevMatch();
            else findNextMatch();
        } else if (e.key === "Escape") {
            closeSearchBar();
        }
    }

    function insertSymbol(sym) {
        editor.replaceSelection(sym);
        editor.focus();
    }

    function togglePreview() {
        const iframe = document.getElementById('previewIframe');
        if (!isPreviewMode) {
            const code = editor.getValue();
            iframe.style.display = 'block';
            cmWrapper.style.display = 'none';
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            doc.open(); 
            doc.write(code); 
            doc.close();
            isPreviewMode = true;
        } else { 
            closePreview(); 
        }
    }

    function closePreview() {
        document.getElementById('previewIframe').style.display = 'none';
        cmWrapper.style.display = '';
        isPreviewMode = false;
    }

    async function pasteFromClipboard() {
        try {
            const text = await navigator.clipboard.readText();
            createNewFile('html');
            editor.setValue(text);
            openSaveModal();
        } catch (err) {
            alert('ক্লিপবোর্ড এক্সেস করার অনুমতি দিন অথবা কোডটি লিখে পেস্ট করুন।');
        }
    }

    function handleFileUpload(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            let files = loadFiles();
            files.unshift({ name: file.name, code: e.target.result, time: 'Just now', path: 'Uploaded', pinned: false });
            saveFiles(files); 
            renderRecentFiles(); 
            openFile(0);
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    function goHome() {
        closePreview();
        closeSearchBar();
        document.getElementById('editorScreen').classList.remove('active');
        document.getElementById('homeScreen').classList.add('active');
        document.body.classList.remove('editor-mode');
        renderRecentFiles();
    }

    window.onload = function() {
        renderRecentFiles();
        editor.refresh();
    };
</script>
</body>
</html>
